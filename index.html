<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tropicool">
  <meta name="theme-color" content="#2a7be4">
  <title>Tropicool</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261029155208">
  <script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js?v=20261029155208",
    "./src/audio.js": "./src/audio.js?v=20261029155208",
    "./src/axe.js": "./src/axe.js?v=20261029155208",
    "./src/axeModel.js": "./src/axeModel.js?v=20261029155208",
    "./src/fishing.js": "./src/fishing.js?v=20261029155208",
    "./src/grass.js": "./src/grass.js?v=20261029155208",
    "./src/input.js": "./src/input.js?v=20261029155208",
    "./src/inventory.js": "./src/inventory.js?v=20261029155208",
    "./src/main.js": "./src/main.js?v=20261029155208",
    "./src/noise.js": "./src/noise.js?v=20261029155208",
    "./src/player.js": "./src/player.js?v=20261029155208",
    "./src/shaders.js": "./src/shaders.js?v=20261029155208",
    "./src/sky.js": "./src/sky.js?v=20261029155208",
    "./src/structures.js": "./src/structures.js?v=20261029155208",
    "./src/terrain.js": "./src/terrain.js?v=20261029155208",
    "./src/textures.js": "./src/textures.js?v=20261029155208",
    "./src/vegetation.js": "./src/vegetation.js?v=20261029155208",
    "./src/water.js": "./src/water.js?v=20261029155208",
    "./src/world.js": "./src/world.js?v=20261029155208"
  }
}
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="bite">!</div>
    <div id="toast"></div>
    <div id="catch" class="card hidden">
      <canvas id="catch-icon" width="32" height="16"></canvas>
      <div>
        <div id="catch-badge"></div>
        <div id="catch-name"></div>
        <div id="catch-info"></div>
      </div>
    </div>
    <div id="fps"></div>
    <div id="hint"></div>
    <div id="held-name"></div>
    <div id="hotbar" class="glass"><div class="lens"></div><div class="slots"></div></div>
  </div>

  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <button id="btn-menu" class="tbtn small" aria-label="Menu">☰</button>
    <button id="btn-inv" class="tbtn small" aria-label="Inventaire">🎒</button>
    <button id="btn-fish" class="tbtn big" aria-label="Pêcher">🎣</button>
    <button id="btn-jump" class="tbtn mid" aria-label="Sauter">⤒</button>
  </div>

  <div id="start" class="screen">
    <div class="panel title-panel">
      <h1>Tropicool</h1>
      <p class="sub">Un archipel paisible à explorer, à ton rythme.</p>
      <button id="play" class="primary">Jouer</button>
      <button id="start-settings">Configurer l'archipel</button>
      <p class="tiny" id="pad-status">Tactile, clavier/souris ou manette (DualSense, Xbox, AYN Thor)</p>
    </div>
  </div>

  <div id="menu" class="screen hidden">
    <div class="panel">
      <div class="tabs">
        <button data-tab="world" class="tab active">Archipel</button>
        <button data-tab="options" class="tab">Options</button>
        <button data-tab="journal" class="tab">Journal</button>
      </div>

      <section data-panel="world">
        <label>Nombre d'îles <output data-for="islands"></output>
          <input type="range" id="islands" min="1" max="10" step="1"></label>
        <label>Taille des îles <output data-for="size"></output>
          <input type="range" id="size" min="0.5" max="1.6" step="0.05"></label>
        <label>Relief <output data-for="relief"></output>
          <input type="range" id="relief" min="0" max="1" step="0.05"></label>
        <label>Végétation <output data-for="vegetation"></output>
          <input type="range" id="vegetation" min="0" max="1" step="0.05"></label>
        <label>Graine
          <span class="row"><input type="number" id="seed" min="1" max="999999"><button id="dice" aria-label="Graine aléatoire">🎲</button></span></label>
        <button id="generate" class="primary">Générer l'archipel</button>
      </section>

      <section data-panel="options" class="hidden">
        <label>Qualité
          <select id="quality">
            <option value="low">Basse (batterie)</option>
            <option value="medium">Moyenne</option>
            <option value="high">Haute</option>
          </select></label>
        <label>Résolution <output data-for="res"></output>
          <input type="range" id="res" min="0.4" max="1.5" step="0.05"></label>
        <label class="check"><input type="checkbox" id="autores"> Résolution dynamique (fluidité)</label>
        <label>Sensibilité de la vue <output data-for="sens"></output>
          <input type="range" id="sens" min="0.3" max="2.5" step="0.1"></label>
        <label>Volume <output data-for="volume"></output>
          <input type="range" id="volume" min="0" max="1" step="0.05"></label>
        <label class="check"><input type="checkbox" id="showfps"> Afficher les FPS</label>
      </section>

      <section data-panel="journal" class="hidden">
        <div id="journal-list"></div>
      </section>

      <button id="resume" class="primary">Reprendre</button>
      <p class="tiny" id="controls-help"></p>
    </div>
  </div>

 <div id="inventory" class="hidden">
    <div class="inv-panel glass">
      <div class="inv-head">
        <span class="inv-title">Inventaire</span>
        <button id="inv-close" class="glass-btn" aria-label="Fermer">✕</button>
      </div>
      <div id="inv-storage" class="grid"></div>
      <div id="inv-hotbar" class="grid hot"></div>
      <p class="inv-help" id="inv-help"></p>
    </div>
    <div id="inv-cursor" class="slot floating hidden"><img alt=""><span class="count"></span></div>
    <div id="inv-tip" class="glass tip hidden"></div>
  </div>

  <div id="loading" class="screen hidden"><div class="panel"><p>Génération de l'archipel…</p></div></div>

  <script>
    // Startup guard: if the game fails to boot, say so and offer a clean reload
    // (clears the offline cache + service worker) instead of a frozen menu.
    window.TROPICOOL_VERSION = '20261029155208';
    window.__bootFail = function (msg) {
      if (window.__booted || document.getElementById('boot-error')) return;
      var p = document.querySelector('#start .panel');
      if (!p) return;
      var d = document.createElement('div');
      d.id = 'boot-error';
      d.innerHTML = '<p>Le jeu n\'a pas pu démarrer.</p><p class="tiny">' + String(msg).replace(/</g, '&lt;') + '</p><button class="primary" id="boot-reload">Recharger proprement</button>';
      p.appendChild(d);
      document.getElementById('boot-reload').onclick = async function () {
        try { for (const r of (await navigator.serviceWorker?.getRegistrations?.()) || []) await r.unregister(); } catch (e) {}
        try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
        location.reload();
      };
    };
    addEventListener('error', function (e) { window.__bootFail(e.message || 'erreur de script'); });
    addEventListener('unhandledrejection', function (e) { window.__bootFail((e.reason && e.reason.message) || 'erreur de chargement'); });
    setTimeout(function () { if (!window.__booted) window.__bootFail('Chargement trop long (connexion ?)'); }, 20000);
  </script>
  <script type="module" src="src/main.js?v=20261029155208"></script>
</body>
</html>
